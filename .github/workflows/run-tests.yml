name: Run Jest Tests

# Trigger workflow on pull requests to Development or Testing
on:
  pull_request:
    branches:
      - Development
      - Testing
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Run Jest tests
      - name: Run Jest
        run: npm test   # Or "npx jest" if your script isn't named test
