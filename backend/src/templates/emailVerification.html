<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Verification</title>
    <style>
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 0;
        color: #333;
      }

      .container {
        max-width: 600px;
        margin: 40px auto;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.06);
        overflow: hidden;
      }

      .header {
        background-color: #0b5173;
        padding: 20px;
        text-align: center;
      }

      .header img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .logo-bg {
        width: 60px;
        height: 60px;
        background-color: #efefef;
        border-radius: 100%;
        display: inline-block;
        text-align: center;
      }

      .content {
        padding: 30px;
        text-align: center;
      }

      .content h2 {
        color: #0b5173;
        margin-bottom: 16px;
      }

      .content p {
        line-height: 1.6;
        margin-bottom: 24px;
        color: #555;
      }

      .button {
        display: inline-block;
        padding: 12px 28px;
        background-color: #0b5173;
        color: #ffffff !important;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        transition: background-color 0.3s ease;
      }

      .button:hover {
        background-color: #083c55;
      }

      .footer {
        background-color: #f0f4f8;
        padding: 16px;
        text-align: center;
        font-size: 13px;
        color: #777;
      }

      @media (max-width: 600px) {
        .content {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="logo-bg">
          <img src="cid:logo" alt="Company Logo" />
        </div>
      </div>

      <div class="content">
        <h2>Confirm Your Email Address</h2>
        <p>
          Thank you for signing up! Use the verification code below to confirm
          your email address.
        </p>

        <p>
          Your verification code <br /><strong
            style="font-size: 24px; letter-spacing: 0.75rem"
          >
            {{otp}}</strong
          >
        </p>

        <p style="margin-top: 24px; font-size: 14px">
          If you didn’t create an account, you can safely ignore this email.
        </p>
      </div>

      <div class="footer">
        &copy; {{year}} Amihan Staycation. All rights reserved.
      </div>
    </div>
  </body>
</html>
